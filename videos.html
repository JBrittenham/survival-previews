<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oak Walk Videos</title>
<style>
  :root { --bg: #10140f; --panel: #1a2018; --text: #e8eee4; --muted: #a9b5a3; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  p.lead { color: var(--muted); margin: 0 0 24px; }
  figure { margin: 0 0 22px; background: var(--panel); border-radius: 10px; overflow: hidden; }
  video { display: block; width: 100%; height: auto; background: #000; }
  figcaption { padding: 10px 14px 14px; display: grid; gap: 2px; }
  figcaption span { color: var(--muted); font-size: .92rem; }
  a { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Oak walk videos</h1>
  <p class="lead">20-second eye-height walks through the oak grove (about 1.5 m/s), rendered from the current development build with crown cross-fades (PR #22). 720p, 30 fps. <a href="trees.html">Tree stills</a> · <a href="index.html">Gallery home</a></p>
  <figure>
    <a href="images/crown-depth-v1-compare.jpg"><img src="images/crown-depth-v1-compare.jpg" alt="Crown depth" loading="lazy" style="display:block;width:100%"></a>
    <figcaption><strong>New: deeper tree crowns</strong><span>Left before, right after: dark crown interiors and undersides with sunlit tops, and lighter and darker leaf patches.</span></figcaption>
  </figure>
  <figure>
    <video src="videos/aa-smaa-vs-taa.mp4" controls playsinline preload="metadata"></video>
    <figcaption><strong>Anti-aliasing: SMAA vs TAA</strong><span>The same grove walk. Left SMAA (the current default), right TAA, which smooths grass and leaf edges for a softer, more Valheim-like image. Watch for smearing on swaying grass.</span></figcaption>
  </figure>
  <figure>
    <a href="images/terrain-smooth-v1-compare.jpg"><img src="images/terrain-smooth-v1-compare.jpg" alt="Smooth terrain, no water" loading="lazy" style="display:block;width:100%"></a>
    <figcaption><strong>New: smooth hills, water off</strong><span>Left angular facets, right smooth shading with rounded mounds. The sea is switched off for now, so the old coast is meadow.</span></figcaption>
  </figure>
  <figure>
    <a href="images/valheim-gap-v1-compare.jpg"><img src="images/valheim-gap-v1-compare.jpg" alt="Warmer air, rolling ground, open meadows" loading="lazy" style="display:block;width:100%"></a>
    <figcaption><strong>New: closer to Valheim</strong><span>Left before, right after: warmer hazier light, rolling mounds, open meadows between woods, and stone and log scatter.</span></figcaption>
  </figure>
  <figure>
    <video src="videos/sky-daycycle-hillside.mp4" controls playsinline preload="metadata"></video>
    <figcaption><strong>New: sky through a day</strong><span>The open hillside from night to night: fuller clouds lit from the sun's side, wisps above them, a warm horizon at low sun, and moonlit clouds after dark.</span></figcaption>
  </figure>
  <figure>
    <a href="images/sky-v1-compare.jpg"><img src="images/sky-v1-compare.jpg" alt="Sky before and after" loading="lazy" style="display:block;width:100%"></a>
    <figcaption><strong>Sky before and after</strong><span>Day, golden hour and overcast. Left before, right after.</span></figcaption>
  </figure>
  <figure>
    <a href="images/sky-v1-compare-dawn-dusk.jpg"><img src="images/sky-v1-compare-dawn-dusk.jpg" alt="Sky dawn and dusk" loading="lazy" style="display:block;width:100%"></a>
    <figcaption><strong>Dawn and dusk</strong><span>First-pass captures of dawn and dusk (overcast in this set is before the softening fix).</span></figcaption>
  </figure>
  <figure>
    <a href="images/grass-carpet-v1-compare.jpg"><img src="images/grass-carpet-v1-compare.jpg" alt="Carpet grass before and after" loading="lazy" style="display:block;width:100%"></a>
    <figcaption><strong>New: carpet grass</strong><span>Left today, right with wider tufts and double density around the player. About +0.5 ms GPU on the RTX 5080 at 1080p.</span></figcaption>
  </figure>
  <figure>
    <a href="images/grass-density-1x-2x.jpg"><img src="images/grass-density-1x-2x.jpg" alt="Grass density 1x vs 2x" loading="lazy" style="display:block;width:100%"></a>
    <figcaption><strong>Grass density test: 1x vs 2x</strong><span>Left today's density, right double. Measured GPU cost on the RTX 5080 at 1080p: about +0.7 ms for each extra 1x across the whole grass window.</span></figcaption>
  </figure>
  <figure>
    <a href="images/meadow-turf-v1-compare.jpg"><img src="images/meadow-turf-v1-compare.jpg" alt="Meadow turf before and after" loading="lazy" style="display:block;width:100%"></a>
    <figcaption><strong>New: less patchy meadow</strong><span>Left before, right after. Ground between tufts now reads as short turf rather than soil, and the grass varies in broad, gentle drifts.</span></figcaption>
  </figure>
  <figure>
    <video src="videos/gusts-meadow-day.mp4" controls playsinline preload="metadata"></video>
    <figcaption><strong>New: gusts across the meadow</strong><span>A fixed camera on the hillside for 20 seconds. Watch the paler bands sweep through the grass from left to right as gusts roll in, with the oaks swaying harder in the same sweeps.</span></figcaption>
  </figure>
  <figure>
    <video src="videos/gusts-meadow-golden.mp4" controls playsinline preload="metadata"></video>
    <figcaption><strong>Gusts at golden hour</strong><span>The same view in low warm light.</span></figcaption>
  </figure>
  <figure>
    <video src="videos/grass-flowers-walk.mp4" controls playsinline preload="metadata"></video>
    <figcaption><strong>New: gusts and wildflowers</strong><span>The grove walk with wind arriving in sweeping bands (blades lighten as a gust crest passes) and drifts of white, yellow, violet and pink wildflowers.</span></figcaption>
  </figure>
  <figure>
    <a href="images/grass-flowers-v1-compare.jpg"><img src="images/grass-flowers-v1-compare.jpg" alt="Grass before and after" loading="lazy" style="display:block;width:100%"></a>
    <figcaption><strong>Grass before and after</strong><span>Left before, right after: ground-level close-up, meadow edge and golden hour.</span></figcaption>
  </figure>
  <figure>
    <a href="images/moon-phases-v1.png"><img src="images/moon-phases-v1.png" alt="Moon phases" loading="lazy" style="display:block;width:100%"></a>
    <figcaption><strong>New: moon phases</strong><span>The same 21:30 view under a new, crescent, first-quarter, full and last-quarter moon (8-day cycle). Bottom row zooms in on the moon. New-moon nights are much darker.</span></figcaption>
  </figure>
  <figure>
    <video src="videos/daycycle-shore.mp4" controls playsinline preload="metadata"></video>
    <figcaption><strong>New: day/night cycle, shore</strong><span>One day from 03:30 to 23:30 in 20 seconds: moonlit night with stars, misty dawn, midday, golden hour, dusk and moonrise. In game a full day lasts 24 minutes.</span></figcaption>
  </figure>
  <figure>
    <video src="videos/daycycle-spawn.mp4" controls playsinline preload="metadata"></video>
    <figcaption><strong>Day/night cycle, spawn view</strong><span>The same day from the ordinary player camera in the grove.</span></figcaption>
  </figure>
  <figure>
    <a href="images/daycycle-v1-shore.png"><img src="images/daycycle-v1-shore.png" alt="Day cycle stills" loading="lazy" style="display:block;width:100%"></a>
    <figcaption><strong>Stills through the day</strong><span>Twelve moments from the shore timelapse, labelled with the in-game time.</span></figcaption>
  </figure>
  <figure>
    <video src="videos/oak-undergrowth-walk.mp4" controls playsinline preload="metadata"></video>
    <figcaption><strong>New: undergrowth</strong><span>Same grove walk with bushes and oak saplings in the shade near trunks, swaying with the trees. Visual only, about 0.03 to 0.1 ms of GPU time on the RTX 5080.</span></figcaption>
  </figure>
  <figure>
    <a href="images/undergrowth-v1-compare.jpg"><img src="images/undergrowth-v1-compare.jpg" alt="Before and after undergrowth" loading="lazy" style="display:block;width:100%"></a>
    <figcaption><strong>Before and after</strong><span>Left without undergrowth, right with it: grove, spawn view and golden hour.</span></figcaption>
  </figure>
  <figure>
    <video src="videos/oak-wind-roots.mp4" controls playsinline preload="metadata"></video>
    <figcaption><strong>New: branches sway with the leaves</strong><span>Same grove walk after the tree polish pass: trunks and limbs now move with the canopy wind, crowns vary more in colour, and the trunk bases have roots and patchy moss.</span></figcaption>
  </figure>
  <figure>
    <a href="images/polish-v1-day-trunk-base.jpg"><img src="images/polish-v1-day-trunk-base.jpg" alt="Oak trunk base" loading="lazy" style="display:block;width:100%"></a>
    <figcaption><strong>Trunk base close-up</strong><span>Surface roots flaring out of the stump, moss settling into the low bark furrows, and grass thinning around the trunk.</span></figcaption>
  </figure>
  <figure>
    <video src="videos/oak-walk-day.mp4" controls playsinline preload="metadata"></video>
    <figcaption><strong>Day walk</strong><span>Through the grove and up the path, with a slow look around. Watch the leaves in the wind and trees changing detail in the distance.</span></figcaption>
  </figure>
  <figure>
    <video src="videos/oak-walk-goldenhour.mp4" controls playsinline preload="metadata"></video>
    <figcaption><strong>Golden hour walk</strong><span>The same route in low warm light, with sun shafts and backlit haze.</span></figcaption>
  </figure>
</main>
</body>
</html>
